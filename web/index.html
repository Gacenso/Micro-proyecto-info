<!DOCTYPE html>
<html lang="es">
<head>
  <!--
    "$FLUTTER_BASE_HREF" se reemplaza al compilar con --base-href.
    En GitHub Pages el workflow usa --base-href "/<nombre-del-repo>/".
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="15-Puzzle Flutter: rompecabezas deslizante con 3 dificultades, marcadores y temas. Funciona sin conexión.">
  <meta name="theme-color" content="#5B5BD6">

  <!-- iOS -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="15-Puzzle">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">

  <title>15-Puzzle Flutter</title>

  <style>
    html, body { margin: 0; height: 100%; background: #F4F3FF; }
    @media (prefers-color-scheme: dark) { html, body { background: #14131F; } }
    #loading {
      position: fixed; inset: 0; display: flex; align-items: center;
      justify-content: center; font-family: sans-serif; color: #5B5BD6;
    }
    #loading .grid {
      display: grid; grid-template-columns: repeat(3, 22px); gap: 5px;
      animation: pulse 1.2s ease-in-out infinite;
    }
    #loading .grid span { width: 22px; height: 22px; border-radius: 6px; background: #5B5BD6; }
    #loading .grid span.empty { background: transparent; }
    @keyframes pulse { 50% { opacity: .45; transform: scale(.94); } }
  </style>
</head>
<body>
  <!-- Indicador mientras carga Flutter; se quita al dibujar el primer cuadro. -->
  <div id="loading" aria-label="Cargando">
    <div class="grid">
      <span></span><span></span><span></span>
      <span></span><span></span><span></span>
      <span></span><span></span><span class="empty"></span>
    </div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('loading');
      if (el) el.remove();
    });

    // Service worker propio (web/sw.js): guarda la app en caché para que
    // funcione sin conexión e instalada como PWA.
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function (error) {
          console.warn('No se pudo registrar el service worker:', error);
        });
      });
    }
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
